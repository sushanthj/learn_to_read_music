<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Learn to read music notation with a progressive, level-based curriculum">
  <meta name="theme-color" content="#4361ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sight-Read">
  <title>Sight-Reading Trainer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/vexflow@5.0.0/build/cjs/vexflow.js"></script>
</head>
<body>
  <header>
    <h1>Sight-Reading Trainer</h1>
    <p>Identify the note on the staff</p>
    <nav class="nav-tabs">
      <a href="index.html" class="nav-tab active">Quiz</a>
      <a href="compose.html" class="nav-tab">Compose</a>
      <a href="practice.html" class="nav-tab">Practice</a>
    </nav>
  </header>

  <main class="container">
    <!-- Clef selector -->
    <div class="controls">
      <button class="clef-btn active" data-clef="treble">Treble</button>
      <button class="clef-btn" data-clef="bass">Bass</button>
      <button class="clef-btn" data-clef="grand">Grand</button>
    </div>

    <!-- Instrument mode -->
    <div class="controls">
      <button class="instrument-btn active" data-mode="piano">🎹 Piano</button>
      <button class="instrument-btn" data-mode="guitar">🎸 Guitar</button>
    </div>

    <!-- MIDI section -->
    <div class="midi-section" id="midi-section">
      <label class="midi-toggle-label">
        <input type="checkbox" id="midi-toggle">
        MIDI Input
      </label>
      <span class="midi-status disconnected" id="midi-status"></span>
    </div>

    <!-- Microphone / pitch detection section -->
    <div class="mic-section" id="mic-section">
      <label class="midi-toggle-label">
        <input type="checkbox" id="mic-toggle">
        🎤 Mic Input
      </label>
      <span class="midi-status disconnected" id="mic-status"></span>
      <div class="mic-controls hidden" id="mic-controls">
        <div class="mic-meter">
          <div class="mic-meter-fill" id="mic-meter-fill"></div>
          <div class="mic-meter-threshold" id="mic-meter-threshold"></div>
        </div>
        <label class="mic-threshold-label">
          Threshold
          <input type="range" id="mic-threshold" min="0.005" max="0.15" step="0.005" value="0.06">
        </label>
      </div>
    </div>

    <!-- Level section -->
    <div class="level-section" id="level-section">
      <div class="level-header">
        <div class="level-info">
          <span class="level-badge" id="level-badge">Level 1</span>
          <span class="level-name" id="level-name">Staff Lines</span>
        </div>
        <button class="level-selector-btn" id="level-selector-btn" title="Select level">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect y="2" width="18" height="2" rx="1" fill="currentColor"/>
            <rect y="8" width="18" height="2" rx="1" fill="currentColor"/>
            <rect y="14" width="18" height="2" rx="1" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div class="level-description" id="level-description">Every Good Boy Does Fine</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="progress-text" id="progress-text">Answer 10 notes with 85%+ accuracy to advance</div>
    </div>

    <!-- Level dropdown -->
    <div class="level-dropdown hidden" id="level-dropdown"></div>

    <!-- Staff display -->
    <div class="staff-container">
      <div id="staff"></div>
    </div>

    <!-- Fingering hint (optional, toggled by user) -->
    <div class="fingering-row" id="fingering-row">
      <button class="hint-btn" id="hint-toggle">🎹 Show hint</button>
      <div class="fingering-hint hidden" id="fingering-hint"></div>
    </div>

    <!-- Feedback -->
    <div class="feedback" id="feedback">&nbsp;</div>

    <!-- Note buttons -->
    <div class="note-buttons" id="note-buttons">
      <!-- Dynamic answer options generated by JavaScript -->
    </div>

    <p class="hint">or press A–G on keyboard (Shift for ♯)</p>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0 / 0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Accuracy</div>
        <div class="stat-value" id="accuracy">0%</div>
      </div>
      <div class="stat">
        <div class="stat-label">Streak</div>
        <div class="stat-value" id="streak">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Best Streak</div>
        <div class="stat-value" id="best-streak">0</div>
      </div>
    </div>
  </main>

  <!-- Level-up celebration overlay -->
  <div class="level-up-overlay hidden" id="level-up-overlay">
    <div class="level-up-card">
      <div class="level-up-trophy">&#127942;</div>
      <div class="level-up-title">Level Up!</div>
      <div class="level-up-level" id="level-up-level">Level 2</div>
      <div class="level-up-name" id="level-up-name">Staff Spaces</div>
      <div class="level-up-desc" id="level-up-desc">FACE</div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
